<div class="log-container" ref="logEl">
  <div v-for="(l,i) in displayLogs" :key="i" class="log-card">
    <div class="log-header">
      <span class="meta-time">{{ l.time }}</span>
      <span class="tag tag-ip">{{ l.ip || '127.0.0.1' }}</span>
      <span class="tag tag-user">{{ l.user }}</span>
      <span class="tag tag-action" v-if="l.action">{{ formatAction(l.action) }}</span>
      <span class="tag tag-flow"
            :style="{color: l.flow===0 ? store.cfg.booth.colors.flow_send : store.cfg.booth.colors.flow_recv}">
        {{ l.flow===0 ? '发送' : '接收' }}
      </span>
    </div>
    <div class="log-content" :style="{borderLeftColor: levelColor(l.level, l.flow)}">
      <span v-html="l._html"></span>
    </div>
  </div>
  <div v-if="!queried" class="empty-state">
    <div class="empty-icon">🔍</div>
    设置好时间范围后点击上方"查询"按钮
  </div>
  <div v-else-if="displayLogs.length === 0" class="empty-state">
    <div class="empty-icon">📭</div>
    {{ logs.length === 0 ? '未查询到任何记录' : '没有匹配过滤条件的记录' }}
  </div>
</div>
